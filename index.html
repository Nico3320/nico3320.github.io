<!DOCTYPE HTML>
<html>
  <head>
    
  </head>
  <body>
    <img id="bild" src="hat-cat.jpeg" draggable="false" onclick="startVideo()" oncontextmenu="return false;">

    <video id="video" playsinline preload="auto">
      <source src="Katze.mp4" type="video/mp4">
    </video>
    
  </body>
</html>

<style>
  
  body {
    margin: 0;
    background-color: #494D5F;
  }
  img {
    display: block;
    width: 100%;
    height: auto;
  
    max-width: 100%;
    max-height: 100dvh;
    object-fit: contain;

    transition: transform 0.2s ease;
    transform-origin: center;

  }
  video {
    display: none;
    width: 100%;
    height: auto;
    max-height: 100dvh;
    object-fit: contain;
  }
  /* img:active {
    transform: scaleY(0.5);
    
  } */
  
</style>

<script>
  const bild = document.getElementById("bild");
  const video = document.getElementById("video");

  async function startVideo() {
    video.currentTime = 0;

    bild.style.display = "none";
    video.style.display = "block";

    try {
      await video.play();
      console.log("Video wird abgespielt");
    } catch (error) {
      console.error("Videofehler:", error);
  
      video.style.display = "none";
      bild.style.display = "block";
    }

    video.addEventListener("ended", () => {
      video.style.display = "none";
      bild.style.display = "block";
    });
    
    video.addEventListener("error", () => {
      console.error("Video konnte nicht geladen werden:", video.error);
    });
  }
  
</script>
